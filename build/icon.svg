<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB15C"/>
      <stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFC233"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7A2E00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centered in the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="4"/>
  <!-- the Foreman: a dark rounded body with a hard hat -->
  <g filter="url(#soft)" transform="rotate(-8 512 560)">
    <rect x="292" y="390" width="440" height="400" rx="185" fill="#17120F"/>
    <path d="M336 470 C 360 330 440 280 512 280 C 584 280 664 330 688 470 Z" fill="url(#hat)"/>
    <rect x="300" y="452" width="424" height="52" rx="26" fill="#FFB800"/>
    <rect x="494" y="250" width="36" height="66" rx="18" fill="#FFC233"/>
    <ellipse cx="440" cy="618" rx="30" ry="46" fill="#FFF7EE"/>
    <ellipse cx="584" cy="618" rx="30" ry="46" fill="#FFF7EE"/>
  </g>
</svg>
