<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: warm orange to coral, lit from the top -->
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFB257"/>
      <stop offset="0.55" stop-color="#FF7A2B"/>
      <stop offset="1" stop-color="#F2541B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
    <!-- Hard hat -->
    <linearGradient id="hat" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFE9A3"/>
      <stop offset="0.6" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#F5A900"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#E89800"/>
    </linearGradient>
    <!-- Body: near-black with a soft top light -->
    <radialGradient id="body" cx="0.42" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#3A2F28"/>
      <stop offset="0.45" stop-color="#1D1713"/>
      <stop offset="1" stop-color="#0E0B09"/>
    </radialGradient>
    <filter id="tile" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#3A1300" flood-opacity="0.28"/>
    </filter>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#6B2300" flood-opacity="0.42"/>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- macOS icon grid: an 824px rounded square centred on the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- a faint ground shadow under the character -->
    <ellipse cx="516" cy="818" rx="180" ry="26" fill="#7A2600" opacity="0.12"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- SahilBot: a dark rounded friend in a hard hat, leaning in -->
  <g filter="url(#lift)" transform="rotate(-7 512 570)">
    <!-- body -->
    <rect x="290" y="392" width="444" height="404" rx="190" fill="url(#body)"/>
    <!-- hat dome -->
    <path d="M334 474 C 356 334 438 276 512 276 C 586 276 668 334 690 474 Z" fill="url(#hat)"/>
    <!-- centre ridge and a glossy streak -->
    <path d="M506 300 C 509 340 510 400 509 466 L 517 466 C 517 400 516 340 518 300 Z" fill="#E9A000" opacity="0.28"/>
    <path d="M392 420 C 402 360 438 320 478 304" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>
    <!-- brim -->
    <rect x="296" y="454" width="432" height="54" rx="27" fill="url(#brim)"/>
    <rect x="316" y="460" width="300" height="10" rx="5" fill="#FFFFFF" opacity="0.35"/>
    <!-- top knob -->
    <rect x="493" y="244" width="38" height="68" rx="19" fill="#FFCB45"/>
    <rect x="502" y="252" width="10" height="34" rx="5" fill="#FFFFFF" opacity="0.5"/>
    <!-- eyes, with a small catchlight each -->
    <ellipse cx="440" cy="622" rx="31" ry="47" fill="#FFF8F0"/>
    <ellipse cx="586" cy="622" rx="31" ry="47" fill="#FFF8F0"/>
    <circle cx="450" cy="604" r="9" fill="#FFFFFF"/>
    <circle cx="596" cy="604" r="9" fill="#FFFFFF"/>
    <!-- a hint of a smile -->
    <path d="M488 702 C 504 716 530 716 546 702" fill="none" stroke="#FFF1E2" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
